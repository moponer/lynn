# 风铃 Lynn · 打包配置（§4.6 / M0 测试包）
# 说明：先关闭 asar —— RPC 子进程要用「真文件路径」加载 agent/pi-rpc-entry.mjs
# 与 node_modules 里的 Pi ESM 包；asar 内 ESM 解析不可靠。体积换稳定，后续再优化。
appId: ai.lynn.desktop
productName: Lynn
copyright: Copyright © 2026 Lynn

directories:
  output: release
  buildResources: build

asar: false

files:
  - dist/**/*
  - agent/**/*
  - assets/**/*
  - package.json
  - "!**/*.map"
  - "!**/*.ts"
  - "!**/*.md"

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Lynn-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 风铃 Lynn
  deleteAppDataOnUninstall: false
