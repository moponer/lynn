# 风铃 Lynn · 打包配置（§4.6 / M0 测试包）
appId: ai.lynn.desktop
productName: Lynn
copyright: Copyright © 2026 Lynn

directories:
  output: release
  buildResources: build

# asar 打包（2026-11-16）：此前为 false —— RPC 子进程要用「真文件路径」加载 Pi 官方
# rpc-entry.js 与 agent/extensions/lynn-bridge.mjs，asar 内那些路径对 node 子进程不存在。
# 现在主进程统一过 unpackedPath()（src/main/unpack-path.ts）把 app.asar 改写成
# app.asar.unpacked，配合下面的 asarUnpack 清单即可两全。
# 下列目录**必须** unpack，漏一个就是装完才炸：
#   agent/**                        Pi worker / L1 worker / lynn-bridge 扩展（--extension 传真路径）
#   node_modules/@earendil-works/** Pi 官方 rpc-entry.js 与 SDK
#   node_modules/typebox/**         lynn-bridge.mjs 与 Pi 运行时直接 import
#   node_modules/jiti/**            L1 worker 现场编译插件 TS
#   node_modules/node-screenshots*/**  原生 N-API 二进制（.node 不能从 asar 里 dlopen）
asar: true
asarUnpack:
  - agent/**
  - node_modules/@earendil-works/**
  - node_modules/typebox/**
  - node_modules/jiti/**
  - node_modules/node-screenshots/**
  - node_modules/node-screenshots-*/**

files:
  - dist/**/*
  # 本地验证脚本会把 preload 探针与截图写进 dist/_tmp（scripts/preview-shot.cjs 等）：
  # 那是本机调试产物，不能跟着安装包发出去（截图里可能带着用户的界面内容）。
  - "!dist/_tmp/**"
  - agent/**/*
  - assets/**/*
  # 桌宠暂时停用（2026-11-15）：素材已移出仓库，即使本地归档被放回原位也不打进安装包
  - "!assets/pet-dafeiyu/**"
  # 官方 RPC 入口与扩展运行时依赖：显式带上，避免依赖自动收集漏掉 bundle/chunks
  - node_modules/@earendil-works/**/*
  - node_modules/typebox/**/*
  # L1 worker（agent/l1-worker.mjs）用 jiti 编译插件 TS——打包必须带上（审计 #3）
  - node_modules/jiti/**/*
  # 区域截图：node-screenshots 主包 + 对应平台的 N-API 预编译二进制（asar:false 要显式带上）
  - node_modules/node-screenshots/**/*
  - node_modules/node-screenshots-*/**/*
  # 语音播报（asar:false 要显式带）：Edge TTS 客户端 + WebSocket / 代理依赖
  - node_modules/node-edge-tts/**/*
  - node_modules/ws/**/*
  - node_modules/https-proxy-agent/**/*
  - node_modules/agent-base/**/*
  - package.json
  - "!**/*.map"
  - "!**/*.ts"
  - "!**/*.md"
  # 后置规则覆盖上面的 Markdown 排除：保留生产依赖的许可证与声明
  - "**/LICENSE.md"
  - "**/NOTICE.md"
  - LICENSE
  - THIRD_PARTY_NOTICES.md

win:
  # 真正的 Windows 图标：build/icon.ico 内含 16/24/32/48/64/128/256 七种尺寸（带 alpha）。
  # 源图 assets/icon-1024.png，重做用 python scripts/make-icon.py；不引入 SVG。
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Lynn-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 风铃 Lynn
  deleteAppDataOnUninstall: false
