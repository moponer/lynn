# 风铃 Lynn · 打包配置（§4.6 / M0 测试包）
# 说明：先关闭 asar —— RPC 子进程要用「真文件路径」加载 Pi 官方 rpc-entry.js
# 与 agent/extensions/lynn-bridge.mjs；asar 内 ESM 解析不可靠。体积换稳定，后续再优化。
appId: ai.lynn.desktop
productName: Lynn
copyright: Copyright © 2026 Lynn

directories:
  output: release
  buildResources: build

asar: false

files:
  - dist/**/*
  - agent/**/*
  - assets/**/*
  # 官方 RPC 入口与扩展运行时依赖：显式带上，避免依赖自动收集漏掉 bundle/chunks
  - node_modules/@earendil-works/**/*
  - node_modules/typebox/**/*
  # L1 worker（agent/l1-worker.mjs）用 jiti 编译插件 TS——打包必须带上（审计 #3）
  - node_modules/jiti/**/*
  # 区域截图：node-screenshots 主包 + 对应平台的 N-API 预编译二进制（asar:false 要显式带上）
  - node_modules/node-screenshots/**/*
  - node_modules/node-screenshots-*/**/*
  # 语音播报（asar:false 要显式带）：Edge TTS 客户端 + WebSocket / 代理依赖
  - node_modules/node-edge-tts/**/*
  - node_modules/ws/**/*
  - node_modules/https-proxy-agent/**/*
  - node_modules/agent-base/**/*
  - package.json
  - "!**/*.map"
  - "!**/*.ts"
  - "!**/*.md"

win:
  # 真正的 Windows 图标：build/icon.ico 内含 16/24/32/48/64/128/256 七种尺寸（带 alpha）。
  # 源图 assets/icon-1024.png，重做用 python scripts/make-icon.py；不引入 SVG。
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Lynn-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 风铃 Lynn
  deleteAppDataOnUninstall: false
