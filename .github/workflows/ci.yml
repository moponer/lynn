# CI（2026-11-14）：只跑"不需要窗口"的那套检查。
# 走查（npm run shot）依赖 Electron 窗口，本地跑，不进 CI。
# 用 windows-latest 是因为主力平台是 Windows（路径分隔符、cmd、GBK 解码这些只在 Windows 暴露）。
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # typecheck（渲染层 + 主进程）→ oxlint → 设计规范 → 全量测试（含主进程构建）
      - run: npm run verify
      # 干净仓库再覆盖渲染层构建，防止素材或静态资源缺失回潮
      - run: npm run build:renderer
