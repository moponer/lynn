name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows 优先（计划书 §1.5）；Node 22.19 是 Pi 的 engines 下限，24 为当前 LTS 线
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # 架构红线：Pi 基座完整不变，禁止 patch / fork / 改 dist；并与 npm 官方 tarball 对账
      - run: npm run check:pi-base -- --tarball
      - run: npm run typecheck
      - run: npm run lint:design
      - run: npm test
