<!doctype html>
<html lang="zh-CN" data-theme="dark" data-stream="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LYNN</title>
<style>
@font-face{font-family:'Lynn Archivo';src:url('../../node_modules/@fontsource-variable/archivo/files/archivo-latin-wght-normal.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'Lynn Mono';src:url('../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2') format('woff2');font-weight:400;font-display:swap}
:root{
  /* 沉浸感优先：整屏回到青瓦暗底；层次只做在局部（卡内凹陷 / 浮层），不把左右栏提亮成画框 */
  --bg:#0d1616;--panel:#101a1a;--panel-2:#13201f;--raised:#182624;--sunken:#0b1414;
  --line:rgba(121,194,164,.14);--line-2:rgba(121,194,164,.30);
  --ink:#dfe9e6;--ink-2:#a3b8b1;--ink-3:#8aa29c;--ink-4:#5e7a72;--term:#a9c8b8;
  --phos:#79c2a4;--phos-dim:#3d6f5e;--amber:#c9a227;--seal:#c8443a;--seal-2:#8f332b;--red:#e0775f;
  --ok:#6fc187;--ok-dim:#3f7a4d;--ok-glow:rgba(111,193,135,.16);
  --grid:rgba(121,194,164,.045);--grid-2:rgba(121,194,164,.10);
  --glow:rgba(121,194,164,.20);--glow-seal:rgba(200,68,58,.24);
  --card-bg:rgba(16,26,26,.96);--halo:rgba(9,18,18,.97);
  --sans:'Lynn Archivo','Segoe UI','Microsoft YaHei',sans-serif;
  --mono:'Lynn Mono','Consolas',monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
html[data-theme="light"]{
  --bg:#e6e2d4;--panel:#eeebdf;--panel-2:#e2ded0;--raised:#f4f1e7;--sunken:#d9d5c5;
  --line:#c6c2ae;--line-2:#a7a48e;
  --ink:#262b22;--ink-2:#4e5745;--ink-3:#7c8270;--ink-4:#9a9c88;
  --phos:#4c6a3c;--phos-dim:#8a9a78;--amber:#8a6522;--seal:#a83c26;--seal-2:#c98b7c;
  --ok:#3f7a4a;--ok-dim:#93ad8b;--ok-glow:rgba(63,122,74,.13);
  --grid:rgba(38,43,34,.055);--grid-2:rgba(38,43,34,.10);--red:#a8452f;
  --glow:rgba(76,106,60,.14);--glow-seal:rgba(168,60,38,.16);
  --card-bg:rgba(240,237,226,.97);--halo:rgba(230,226,212,.97);
}
*{box-sizing:border-box}
/* 滚动条不出现在大屏上：滚轮 / 触摸 / 键盘仍可滚动，只去掉那根出戏的条 */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:12px;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:transparent;padding:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.shell{height:100dvh;display:grid;grid-template-rows:52px minmax(0,1fr) 68px}

/* 顶栏：图廓 + 坐标读数 */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);position:relative}
.top::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--line-2);width:64px}
.top-l{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-family:var(--mono);font-size:13px;letter-spacing:.24px;color:var(--phos)}
.top-l .div{width:1px;height:15px;background:var(--line-2)}
.top-l h1{margin:0;font-size:13px;font-weight:500;letter-spacing:.04px}
.live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3)}
.live i{width:5px;height:5px;border-radius:50%;background:var(--phos);box-shadow:0 0 8px 1px var(--glow);animation:blink 2.2s ease-in-out infinite}
.coord{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.08px}
.top-r{display:flex;align-items:center;gap:18px}
.readout{display:flex;align-items:baseline;gap:6px;font-size:10px;color:var(--ink-3)}
.readout b{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--ink)}
.readout.hot b{color:var(--seal)}
.readout.tick b{transition:color .2s var(--ease)}
.clock{font-family:var(--mono);font-size:11px;color:var(--ink-2);letter-spacing:.08px}
.theme-btn{border:1px solid var(--line-2);padding:5px 10px;font-size:11px;color:var(--ink-2);border-radius:1px;transition:border-color .16s var(--ease),color .16s var(--ease),box-shadow .16s var(--ease)}
.theme-btn:hover{border-color:var(--phos);color:var(--ink);box-shadow:0 0 12px var(--glow)}
.seal-mini{display:none;font-family:var(--mono);font-size:10px;padding:4px 8px;border:1px solid currentColor;color:var(--phos);background:var(--panel);box-shadow:0 0 0 2px var(--panel),0 0 0 3px currentColor;white-space:nowrap}
.seal-mini[data-kind="pick"],.seal-mini[data-kind="analyze"],.seal-mini[data-kind="decide"]{color:var(--amber)}
.seal-mini[data-kind="done"]{color:var(--ok)}
.seal-mini[data-kind="clarify"],.seal-mini[data-kind="intervene"]{color:var(--seal);animation:blink 1.6s ease-in-out infinite}
@media(max-width:1000px){.seal-mini{display:inline-block}}

/* 三列 */
.cols{display:grid;grid-template-columns:308px minmax(0,1fr) 288px;min-height:0}
/* 中栏留深景球面，左右栏只靠一条发丝边分区；层次收进局部卡片与浮层，不牺牲沉浸感 */
.col{display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--panel);
  box-shadow:inset -1px 0 0 rgba(0,0,0,.28)}
.col.left{border-right:1px solid var(--line)}
.col.center{background:transparent;box-shadow:none;border-right:1px solid var(--line)}
html[data-theme="light"] .col{box-shadow:inset -1px 0 0 rgba(38,43,34,.06)}
.panel{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel + .panel{border-top:1px solid var(--line)}
.p-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:11px 14px 9px;flex:none;border-bottom:1px solid var(--line)}
/* 标题章：等宽小字 + 凹刻，与内容项（无衬线 12px 常规色）分层；全屏只此一种标题样式 */
.cap,.p-head h2,.map-head h2,.stream-head h3,.lynn-head h2{
  margin:0;font-family:var(--mono);font-size:10px;font-weight:400;letter-spacing:0;color:var(--ink);
  background:var(--sunken);border:1px solid var(--line-2);border-radius:2px;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.58),inset 0 1px 0 rgba(121,194,164,.14);
  padding:3px 8px;line-height:1.5;display:inline-block;white-space:nowrap}
html[data-theme="light"] .cap,html[data-theme="light"] .p-head h2,html[data-theme="light"] .map-head h2,
html[data-theme="light"] .stream-head h3,html[data-theme="light"] .lynn-head h2{
  color:var(--ink);border-color:var(--line);
  box-shadow:inset 0 2px 4px rgba(38,43,34,.15),inset 0 1px 0 rgba(255,255,255,.82)}
.p-head .sub{font-size:10px;color:var(--ink-3);font-family:var(--mono)}
.p-body{overflow-y:auto;min-height:0;padding:0 12px 12px;overscroll-behavior:contain}
#p-intel{flex:0 0 200px}#p-intake{flex:1;min-height:0}
.intel-foot{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--ink-3);flex:none}
.intel-foot b{color:var(--ink-2);font-weight:500}

/* 军情面板：待捞池 */
.queue{position:relative;padding:9px 10px 9px 14px;border-bottom:1px solid var(--line);transition:opacity .4s var(--ease),transform .4s var(--ease),background .4s var(--ease)}
.queue.enter{animation:q-in .5s var(--ease)}
.queue.picked{background:var(--glow-seal)}
.queue.leave{animation:q-out .55s var(--ease) forwards}
.queue .r1{display:flex;align-items:baseline;gap:8px}
.queue .cid{font-family:var(--mono);font-size:10px;color:var(--amber);letter-spacing:.06px}
.queue .time{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-left:auto}
.queue .txt{font-size:12px;line-height:1.5;margin:4px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.queue .r2{display:flex;align-items:center;gap:7px}
.queue .r2 i{width:5px;height:5px;border-radius:50%;background:var(--amber);animation:blink 1.3s ease-in-out infinite}
.queue .r2 span{font-size:10px;color:var(--ink-3)}
.queue-hint{font-size:11px;color:var(--ink-3);padding:18px 12px;text-align:center;line-height:1.7}
.queue-hint .sq{display:inline-block;width:22px;height:22px;margin-bottom:8px;border:1px dashed var(--line-2);position:relative}
.queue-hint .sq::after{content:'';position:absolute;inset:7px;border:1px solid var(--phos-dim)}

/* 受理面板：任务总览（主干轨 + 命令支线汇入） */
.analyzing{display:flex;align-items:center;gap:9px;padding:9px 10px;margin-top:8px;border:1px dashed var(--seal-2);position:relative;overflow:hidden}
.analyzing::after{content:'';position:absolute;left:-40%;top:0;bottom:0;width:40%;background:var(--glow-seal);animation:scan-x 1.3s linear infinite}
.analyzing i{width:6px;height:6px;border-radius:50%;background:var(--seal);box-shadow:0 0 8px 2px var(--glow-seal);animation:blink .8s ease-in-out infinite;flex:none}
.analyzing span{font-size:11px;color:var(--ink-2)}
.analyzing .mono{font-size:10px;color:var(--seal);margin-left:auto}
.task{cursor:pointer;position:relative;padding:12px 10px 10px 22px;margin-top:9px;border:1px solid var(--line);background:var(--panel-2);transition:border-color .3s var(--ease),box-shadow .3s var(--ease)}
.task.enter{animation:t-in .55s var(--ease)}
.task.pulse{animation:t-pulse .9s var(--ease)}
.task.alert{border-color:var(--seal-2)}
.task::before{content:'';position:absolute;left:13px;top:34px;bottom:16px;width:1px;background:var(--line-2)}
.task.flow::before{animation:rail-flow .9s var(--ease)}
.task::after{content:'';position:absolute;left:11px;top:29px;width:5px;height:5px;border:1px solid var(--phos);background:var(--panel);border-radius:50%}
.t-head{display:flex;align-items:center;gap:8px;min-width:0}
.t-id{font-family:var(--mono);font-size:10px;color:var(--phos);letter-spacing:.08px;flex:none}
.t-title{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.t-state{font-size:10px;color:var(--ink-3);margin-left:auto;white-space:nowrap;flex:none}
.t-state.blocked{color:var(--seal)}
.arc{width:30px;height:30px;flex:none;transform:rotate(-90deg)}
.arc circle{fill:none;stroke:var(--line-2);stroke-width:2}
.arc circle.f{stroke:var(--ok);stroke-linecap:butt;transition:stroke-dashoffset .8s var(--ease)}
.arc-wrap{position:relative;width:30px;height:30px;flex:none}
.arc-wrap .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:8px;color:var(--ok)}
.t-goal{font-size:10px;color:var(--ink-3);margin:6px 0 8px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-cmds{margin-left:0}
.cmd-row{position:relative;display:flex;align-items:center;gap:7px;padding:5px 0 5px 13px;min-width:0;transition:background .3s var(--ease)}
.cmd-row::before{content:'';position:absolute;left:0;top:50%;width:11px;height:1px;background:var(--line-2)}
.cmd-row::after{content:'';position:absolute;left:-3px;top:calc(50% - 2px);width:4px;height:4px;border-radius:50%;background:var(--line-2);transition:background .3s var(--ease),box-shadow .3s var(--ease)}
.cmd-row.on::after{background:var(--ok);box-shadow:0 0 6px 1px var(--ok-glow)}
.cmd-row.hot::after{background:var(--seal);box-shadow:0 0 6px 1px var(--glow-seal)}
.cmd-row.enter{animation:c-in .55s var(--ease)}
.cmd-row.revoked{opacity:.45}
.cr-id{font-family:var(--mono);font-size:9px;color:var(--ink-3);flex:none}
.cr-txt{font-size:10px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.cr-txt.revoked{text-decoration:line-through}
.ticks{display:flex;gap:2px;flex:none}
.ticks i{width:5px;height:9px;background:var(--line);border:1px solid var(--line-2);transition:background .4s var(--ease)}
.ticks i.on{background:var(--ok-dim);border-color:var(--ok-dim)}
.ticks i.live{background:var(--amber);border-color:var(--amber);animation:blink 1s ease-in-out infinite}
.ticks i.bad{background:var(--seal);border-color:var(--seal)}
.stamp{font-size:9px;padding:2px 4px;border:1px solid currentColor;flex:none;transform:rotate(-5deg);white-space:nowrap}
.stamp.ok{color:var(--ok);background:var(--ok-glow);box-shadow:0 0 9px var(--ok-glow)}.stamp.bad{color:var(--seal)}.stamp.off{color:var(--ink-3)}
.t-state.done{color:var(--ok)}
.rv{margin-left:2px;font-size:9px;color:var(--ink-3);border-bottom:1px solid var(--line-2);flex:none;opacity:0;transition:opacity .18s var(--ease),color .18s var(--ease)}
.cmd-row:hover .rv{opacity:1}
.rv:hover{color:var(--seal);border-color:var(--seal)}
.t-foot{display:flex;align-items:center;gap:6px;margin:8px 0 0 4px;font-family:var(--mono);font-size:9px;color:var(--ink-3)}
.t-foot .mini{display:flex;gap:3px;margin-left:auto}
.t-foot .mini i{width:9px;height:11px;border:1px solid var(--line-2);background:var(--sunken)}

.merge-strip{margin:12px 0 2px;padding:9px 10px 8px;border:1px dashed var(--line-2)}
.ms-head{font-family:var(--mono);font-size:9px;color:var(--ink-3);margin-bottom:8px;letter-spacing:.04px}
.ms-track{display:flex;gap:5px;flex-wrap:wrap}
.ms-seg{display:flex;gap:2px;padding:3px;border:1px solid var(--line);background:var(--sunken)}
.ms-seg i{width:7px;height:12px;background:var(--ok-dim)}
.ms-seg i.live{background:var(--amber);animation:blink 1.3s ease-in-out infinite}
.ms-seg i.bad{background:var(--seal)}
.ms-seg i.off{background:var(--line-2)}

/* 中间：神经军情图 */
.map-wrap{flex:1;min-height:0;position:relative;overflow:hidden;background:var(--sunken)}
#map{display:block;width:100%;height:100%}
.map-head{position:absolute;left:18px;top:14px;pointer-events:none;display:flex;align-items:center;gap:12px}
.map-head .linkbtn{pointer-events:auto}
.map-legend{position:absolute;left:18px;bottom:14px;display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:9px;color:var(--ink-3);pointer-events:none}
.map-legend span{display:flex;align-items:center;gap:5px}
.lg{width:7px;height:7px;border-radius:50%;border:1px solid var(--phos)}
.lg.on{background:var(--ok);border-color:var(--ok);box-shadow:0 0 7px 1px var(--ok-glow)}
.lg.live{background:var(--amber);border-color:var(--amber)}
.lg.alert{background:var(--seal);border-color:var(--seal)}
.lg.idle{border-color:var(--ink-3)}
.map-sig{position:absolute;right:18px;bottom:14px;font-family:var(--mono);font-size:9px;color:var(--ink-3);letter-spacing:.06px;pointer-events:none;text-align:right;line-height:1.7}
.map-sig b{color:var(--phos);font-weight:500}
.map-hint{position:absolute;right:18px;top:14px;font-size:10px;color:var(--ink-3);pointer-events:none;transition:opacity .3s var(--ease)}
.map-hint kbd{font-family:var(--mono);border:1px solid var(--line-2);padding:1px 4px;margin:0 2px}

/* 左右竖行思考流：降为球面上的底噪层——无容器、无彩色标签、无多层光晕；
   行级 opacity 由 trimFlow 做顶部淡出，主焦点留给球心与态势。点行仍看同类全量 */
.flow-col{position:absolute;top:42px;bottom:52px;width:164px;z-index:6;pointer-events:none;font-family:var(--mono);font-size:9px;color:var(--ink-4)}
/* 终端输出语汇：全等宽 + 行首 > 提示符 + 单色磷光 + 逐字光标 + 呼吸灯；
   降噪参数保留（7/5 行、单行正文、行级淡出、无容器无渐变），浅色关闭发光维持纸面干净 */
.flow-col.left{left:10px}
.flow-col.right{right:10px;width:176px}
.flow-cap{display:flex;align-items:center;gap:6px;height:25px;font-size:9px;letter-spacing:.04px;color:var(--phos-dim);white-space:nowrap;overflow:hidden}
.flow-cap i{width:4px;height:4px;background:var(--phos);box-shadow:0 0 6px var(--glow);animation:blink 2.4s ease-in-out infinite;flex:none}
.flow-cap::after{content:'';width:5px;height:9px;background:var(--phos);animation:blink 1s steps(1,end) infinite;flex:none}
.flow-cap .mono{margin-left:auto;color:var(--ink-4);font-size:8px}
.flow-body{position:absolute;left:0;right:0;top:32px;bottom:8px;overflow:hidden}
.flow-track{position:absolute;left:0;right:0;top:0;transition:transform .3s var(--ease)}
.fl-item{position:relative;height:66px;box-sizing:border-box;padding:6px 2px 4px 0;pointer-events:auto;cursor:pointer;animation:fl-in .3s var(--ease);text-shadow:0 0 6px var(--glow)}
.flow-col.right .fl-item{height:84px;animation-name:fl-in-r}
html[data-theme="light"] .fl-item,html[data-theme="light"] .flow-cap{text-shadow:none}
html[data-theme="light"] .flow-cap{color:var(--ink-2)}
html[data-theme="light"] .flow-cap i,html[data-theme="light"] .flow-cap::after{box-shadow:none;background:var(--ink-3)}
.fl-item:hover .fl-text{color:var(--phos)}
.fl-meta{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;line-height:1}
.fl-meta::before{content:'>';font-size:9px;color:var(--phos);flex:none;margin-right:1px}
html[data-theme="light"] .fl-meta::before{color:var(--ink-3)}
.fl-ts{font-size:8px;color:var(--phos-dim);flex:none}
.fl-kind{font-size:8px;letter-spacing:.06px;color:var(--phos);flex:none}
.fl-kind.alert{color:var(--seal)}
.fl-who{margin-left:auto;font-size:8px;color:var(--ink-4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl-team{font-size:8px;color:var(--ink-3);max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.fl-member{font-size:8px;color:var(--ink-4);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.fl-sub{margin-top:5px;font-size:8px;color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.fl-sub .fl-kind{margin-right:4px}
.fl-text{margin-top:5px;font-family:var(--mono);font-size:10px;line-height:1.5;color:var(--term);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.fl-text.typing::after{content:'';display:inline-block;width:5px;height:9px;margin-left:2px;vertical-align:-1px;background:var(--phos);animation:blink .7s steps(1,end) infinite}
html[data-theme="light"] .fl-ts,html[data-theme="light"] .fl-who,html[data-theme="light"] .fl-sub{color:var(--ink-3)}
html[data-theme="light"] .fl-kind{color:var(--ink-2)}
html[data-theme="light"] .fl-kind.alert{color:var(--seal)}
html[data-theme="light"] .fl-text{color:var(--ink-2)}
html[data-theme="light"] .fl-text.typing::after{background:var(--ink-2)}
@keyframes fl-in{0%{opacity:0;transform:translateX(-8px)}100%{opacity:1;transform:translateX(0)}}
@keyframes fl-in-r{0%{opacity:0;transform:translateX(8px)}100%{opacity:1;transform:translateX(0)}}
@media(max-width:1180px){.flow-col{width:142px}.flow-col.right{width:152px}}
@media(max-width:980px){.flow-col{display:none}}

/* 同类全量流水卡：一次看完整组，开卡后仍持续 LIVE 追加 */
.fs-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:11px;border-bottom:1px solid var(--line)}
.fs-scope{font-size:11px;color:var(--ink-2);line-height:1.6}
.fs-scope b{color:var(--phos);font-weight:500}
.fs-tabs{display:flex;gap:6px;margin-left:auto}
.fs-tabs button{font-size:10px;padding:4px 9px;border:1px solid var(--line-2);color:var(--ink-3);transition:color .16s var(--ease),border-color .16s var(--ease),box-shadow .16s var(--ease)}
.fs-tabs button.on{color:var(--phos);border-color:var(--phos);box-shadow:0 0 10px var(--glow)}
.fs-live{font-family:var(--mono);font-size:10px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.fs-live i{width:5px;height:5px;background:var(--ok);box-shadow:0 0 7px 1px var(--ok-glow);animation:blink 1.6s ease-in-out infinite;flex:none}
.fs-list{max-height:46vh;min-height:140px;overflow-y:auto;overscroll-behavior:contain}
.fs-row{display:grid;grid-template-columns:52px 62px minmax(0,1fr);gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:11px;line-height:1.6;animation:fl-in .3s var(--ease)}
.fs-row .t{font-family:var(--mono);font-size:10px;color:var(--ink-3);padding-top:2px}
.fs-row .k{font-family:var(--mono);font-size:10px;color:var(--ok);height:fit-content;text-align:center;border:1px solid currentColor}
.fs-row .k.tool{color:var(--amber)}
.fs-row .k.alert{color:var(--seal)}
.fs-row .k.think{color:var(--ink-2)}
.fs-row .who{font-size:10px;color:var(--ink-3);margin-bottom:3px}
.fs-row .tx{color:var(--ink);white-space:pre-wrap;word-break:break-word}
.fs-src{margin-top:12px;font-family:var(--mono);font-size:9px;color:var(--ink-3);line-height:1.7;border-top:1px solid var(--line);padding-top:10px}
.src-tb{width:100%;border-collapse:collapse;font-size:11px;line-height:1.6}
.src-tb th{text-align:left;font-weight:500;color:var(--ink-3);padding:7px 8px;border-bottom:1px solid var(--line-2)}
.src-tb td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2)}
.src-tb td:first-child{color:var(--ink);white-space:nowrap}
.src-tb code{font-family:var(--mono);font-size:10px;color:var(--phos)}
.src-tb .gap{color:var(--seal)}
.src-note{margin-top:16px;font-size:11px;line-height:1.9;color:var(--ink-2)}
.src-note b{color:var(--ink);font-weight:500}
.src-note ol{margin:8px 0 0;padding-left:18px}

/* 球心系统告警：卡点时弹出，红框 + 闪烁，可点开处置 */
.alert-hud{position:absolute;left:50%;top:50%;width:306px;z-index:9;padding:12px 14px 11px;
  background:var(--card-bg);border:1px solid var(--seal);color:var(--ink);
  box-shadow:0 0 0 4px var(--bg),0 0 20px var(--glow-seal),inset 0 0 0 1px var(--seal-2);
  transform:translate(-50%,-50%) scale(.94);opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .2s var(--ease),transform .28s var(--ease),visibility .2s}
.alert-hud.on{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-50%) scale(1);
  animation:ah-in .4s var(--ease),ah-pulse 1.2s ease-in-out .4s infinite}
.alert-hud::before,.alert-hud::after{content:'';position:absolute;width:9px;height:9px;border:2px solid var(--seal);pointer-events:none}
.alert-hud::before{left:-2px;top:-2px;border-right:0;border-bottom:0}
.alert-hud::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
.ah-top{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;color:var(--seal);letter-spacing:.08px;padding-bottom:8px;border-bottom:1px solid var(--seal-2)}
.ah-led{width:7px;height:7px;background:var(--seal);box-shadow:0 0 10px 2px var(--glow-seal);flex:none;animation:ah-blink 1s steps(1,end) infinite}
.ah-top .n{margin-left:auto;color:var(--ink-2)}
.ah-title{font-size:13px;line-height:1.5;margin:9px 0 3px;font-weight:500}
.ah-desc{font-family:var(--mono);font-size:10px;line-height:1.6;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ah-acts{display:flex;gap:8px;margin-top:11px}
.ah-acts button{flex:1;font-size:10px;padding:7px 0;border:1px solid var(--seal);color:var(--seal);transition:background .16s var(--ease),color .16s var(--ease),border-color .16s var(--ease)}
.ah-acts button:hover{background:var(--seal);color:var(--bg)}
.ah-acts button.ghost{border-color:var(--line-2);color:var(--ink-2)}
.ah-acts button.ghost:hover{background:transparent;border-color:var(--ink-2);color:var(--ink)}
@keyframes ah-in{0%{opacity:0;transform:translate(-50%,-50%) scale(1.14)}60%{opacity:1;transform:translate(-50%,-50%) scale(.98)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes ah-pulse{0%,100%{box-shadow:0 0 0 4px var(--bg),0 0 18px var(--glow-seal),inset 0 0 0 1px var(--seal-2)}50%{box-shadow:0 0 0 4px var(--bg),0 0 44px 6px var(--glow-seal),inset 0 0 0 1px var(--seal)}}
@keyframes ah-blink{0%,49%{opacity:1}50%,100%{opacity:.16}}

/* HUD 目标锁定卡：默认隐藏 */
.focus{position:absolute;width:272px;background:var(--card-bg);border:1px solid var(--line-2);padding:0;opacity:0;visibility:hidden;transform:scale(.94) translateY(6px);transition:opacity .22s var(--ease),transform .22s var(--ease),visibility .22s;z-index:8;backdrop-filter:blur(3px);box-shadow:0 12px 44px rgba(0,0,0,.4),0 0 26px var(--glow)}
html[data-theme="light"] .focus{box-shadow:0 12px 34px rgba(38,43,34,.18),0 0 22px var(--glow)}
.focus.on{opacity:1;visibility:visible;transform:scale(1) translateY(0)}
.focus::before,.focus::after{content:'';position:absolute;width:12px;height:12px;pointer-events:none}
.focus::before{left:-1px;top:-1px;border-left:2px solid var(--phos);border-top:2px solid var(--phos)}
.focus::after{right:-1px;bottom:-1px;border-right:2px solid var(--phos);border-bottom:2px solid var(--phos)}
.f-corner{position:absolute;width:12px;height:12px;pointer-events:none}
.f-corner.tr{right:-1px;top:-1px;border-right:2px solid var(--phos);border-top:2px solid var(--phos)}
.f-corner.bl{left:-1px;bottom:-1px;border-left:2px solid var(--phos);border-bottom:2px solid var(--phos)}
.f-scan{position:absolute;left:0;right:0;top:0;height:2px;background:var(--phos);box-shadow:0 0 12px 2px var(--glow);opacity:0;pointer-events:none}
.focus.on .f-scan{animation:f-scan 1s var(--ease)}
.f-top{display:flex;align-items:baseline;gap:8px;padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.f-top .no{font-family:var(--mono);font-size:10px;color:var(--phos);letter-spacing:.1px}
.f-top .tag{font-size:9px;color:var(--ink-3);margin-left:auto}
.f-title{padding:11px 12px 9px;font-size:14px;line-height:1.4;font-weight:500}
.f-stamp{position:absolute;right:12px;top:36px;transform:rotate(-9deg);font-size:9px;padding:3px 6px;border:1px solid currentColor;letter-spacing:.06px}
.f-stamp.ok{color:var(--ok)}.f-stamp.live{color:var(--amber)}.f-stamp.alert{color:var(--seal)}
.f-grid{display:grid;grid-template-columns:56px minmax(0,1fr);gap:6px 10px;padding:2px 12px 10px;font-size:10px;line-height:1.5}
.f-grid dt{color:var(--ink-3)}
.f-grid dd{margin:0;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-sec{padding:8px 12px 4px;font-size:9px;color:var(--ink-3);border-top:1px solid var(--line)}
.f-feed{padding:0 12px 8px}
.f-feed div{font-family:var(--mono);font-size:9px;color:var(--ink-2);padding:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-feed div::before{content:'·';color:var(--phos);margin-right:6px}
.f-acts{display:flex;gap:8px;padding:9px 12px 11px;border-top:1px solid var(--line)}
.f-acts button{flex:1;font-size:10px;color:var(--ink-2);border:1px solid var(--line-2);padding:6px 0;transition:border-color .16s var(--ease),color .16s var(--ease),box-shadow .16s var(--ease)}
.f-acts button:hover{border-color:var(--phos);color:var(--ink);box-shadow:0 0 10px var(--glow)}
.f-acts button.x{flex:0 0 42px;color:var(--ink-3)}
.f-acts button.iv{color:var(--seal);border-color:var(--seal)}
.f-acts button.iv:hover{border-color:var(--seal);box-shadow:0 0 12px var(--glow-seal)}
.stamp.bad{cursor:pointer;transition:background .16s var(--ease),color .16s var(--ease)}
.stamp.bad:hover{background:var(--seal);color:var(--bg)}
.iv-acts{display:flex;gap:8px;margin-top:4px}
.iv-acts button{flex:1;font-size:11px;padding:9px 8px;border:1px solid var(--line-2);color:var(--ink-2);background:transparent;transition:border-color .16s var(--ease),color .16s var(--ease),box-shadow .16s var(--ease)}
.iv-acts button:hover{border-color:var(--phos);color:var(--ink);box-shadow:0 0 12px var(--glow)}
.iv-acts button.primary{border-color:var(--seal);color:var(--seal)}
.iv-acts button.primary:hover{border-color:var(--seal);color:var(--ink);box-shadow:0 0 14px var(--glow-seal)}

/* 瀑布流（只留最近 5 行） */
.stream{flex:none;height:146px;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column}
.stream-head{display:flex;align-items:center;gap:10px;padding:8px 16px 7px;border-bottom:1px solid var(--line);flex:none}
.stream-head .loc{font-family:var(--mono);font-size:10px;color:var(--phos);letter-spacing:.06px}
.stream-head .spacer{flex:1}
.linkbtn{font-size:10px;color:var(--ink-3);border-bottom:1px solid var(--line-2);padding-bottom:1px;transition:color .15s var(--ease),border-color .15s var(--ease)}
.linkbtn:hover{color:var(--ink);border-color:var(--phos)}
.stream-lines{flex:1;min-height:0;overflow:hidden;padding:5px 16px 7px;display:flex;flex-direction:column;justify-content:flex-end;gap:0}
.line{display:flex;align-items:baseline;gap:12px;height:21px;flex:none;font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.line .ts{font-family:var(--mono);font-size:10px;color:var(--ink-3);flex:none}
.line .tx{overflow:hidden;text-overflow:ellipsis}
.line.enter{animation:line-in .38s var(--ease)}
.line.lv-hot .tx{color:var(--seal)}
.line.lv-ok .tx{color:var(--phos)}
.line.lv-warn .tx{color:var(--amber)}
.line.empty{color:var(--ink-3)}

/* A/B：去掉中列瀑布流时，态势图独占中列；两侧数据流垂直居中贴球，行数仍锁 7/5 */
html[data-stream="off"] .stream{display:none}
html[data-stream="off"] .map-wrap{height:auto;flex:1}
html[data-stream="off"] .flow-col{bottom:auto;height:540px}
html[data-stream="off"] .flow-col.right{height:540px}
@media(max-width:1000px){
  html[data-stream="off"] .col.center{height:auto}
  html[data-stream="off"] .map-wrap{height:560px;flex:none}
}

/* 风铃状态核心（动效，不是文本） */
.lynn-panel{flex:none;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.lynn-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}
.lynn-head .mono{font-size:10px;color:var(--ink-3)}
.lynn{position:relative;height:172px;display:flex;align-items:center;justify-content:center;--core-c:var(--phos);--ring-c:var(--line-2);--glow-c:rgba(121,194,164,.20)}
.lynn[data-mode="pick"]{--core-c:var(--amber);--glow-c:rgba(201,162,39,.26)}
.lynn[data-mode="analyze"]{--core-c:var(--seal);--ring-c:var(--seal-2);--glow-c:var(--glow-seal)}
.lynn[data-mode="decide"]{--core-c:var(--amber);--glow-c:rgba(201,162,39,.26)}
.lynn[data-mode="dispatch"]{--core-c:var(--phos);--glow-c:var(--glow)}
.lynn[data-mode="intervene"]{--core-c:var(--seal);--ring-c:var(--seal);--glow-c:var(--glow-seal)}
.stage{position:relative;width:160px;height:160px}
.stage .halo{position:absolute;inset:24px;border-radius:50%;box-shadow:0 0 20px 5px var(--glow-c),0 0 60px 20px var(--glow-c);opacity:.55;transition:box-shadow .5s var(--ease)}
.ring{position:absolute;border-radius:50%;border:1px solid var(--line-2)}
.ring.o{inset:0;border-style:dashed;animation:spin 30s linear infinite}
.ring.m{inset:20px;border-color:transparent;border-top-color:var(--ring-c);border-right-color:var(--ring-c);animation:spin 9s linear infinite;transition:border-color .4s var(--ease)}
.ring.i{inset:44px;border-color:var(--line);animation:spin 18s linear infinite reverse}
.scan{position:absolute;inset:20px;border-radius:50%;clip-path:polygon(50% 50%,100% 0,100% 58%);background:var(--glow-c);animation:spin 2.2s linear infinite;opacity:0;transition:opacity .3s var(--ease)}
.core{position:absolute;inset:66px;border-radius:50%;background:var(--core-c);box-shadow:0 0 14px 3px var(--glow-c),0 0 44px 14px var(--glow-c);animation:breathe 3.4s ease-in-out infinite;transition:background .4s var(--ease),box-shadow .4s var(--ease)}
.mark{position:absolute;inset:62px;color:var(--ink);display:flex;align-items:center;justify-content:center;pointer-events:none}
.mark svg{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ray{position:absolute;left:50%;top:50%;width:76px;height:1px;transform-origin:0 50%;background:var(--phos);opacity:0}
.ray.r1{transform:rotate(-45deg)}.ray.r2{transform:rotate(45deg)}.ray.r3{transform:rotate(135deg)}.ray.r4{transform:rotate(225deg)}
.pulse{position:absolute;inset:52px;border:1px solid var(--seal);border-radius:50%;opacity:0}
.lynn[data-mode="pick"] .ring.m{animation-duration:3.4s}
.lynn[data-mode="analyze"] .scan{opacity:1}
.lynn[data-mode="analyze"] .core{animation-duration:1s}
.lynn[data-mode="analyze"] .ring.m{animation-duration:2.4s}
.lynn[data-mode="dispatch"] .ray{animation:ray-flow 1s var(--ease) infinite}
.lynn[data-mode="intervene"] .ring.m{animation-duration:1.6s}
.lynn[data-mode="intervene"] .core{animation-duration:.8s}
.lynn .pulse.once{animation:pulse-out .9s var(--ease)}
/* 方形军印 · 状态，正盖不歪斜 */
.sealbox{position:absolute;left:50%;top:50%;width:116px;height:40px;z-index:4;transform:translate(-50%,26px);
  background:var(--panel);border:1px solid currentColor;color:var(--phos);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  box-shadow:0 0 0 3px var(--panel),0 0 0 4px currentColor,0 0 20px var(--glow-c);
  cursor:pointer;transition:color .3s var(--ease),box-shadow .3s var(--ease)}
.sealbox .s-cn{font-size:13px;font-weight:500;letter-spacing:.18px;line-height:1;color:currentColor}
.sealbox .s-en{font-family:var(--mono);font-size:8px;letter-spacing:.14px;color:currentColor;opacity:.78;line-height:1}
.sealbox .c1,.sealbox .c2{position:absolute;width:5px;height:5px;background:var(--panel);border:1px solid currentColor}
.sealbox .c1{left:-3px;top:-3px}.sealbox .c2{right:-3px;bottom:-3px}
.sealbox .wave{position:absolute;inset:0;border:1px solid currentColor;opacity:0;pointer-events:none}
.sealbox[data-kind="pick"],.sealbox[data-kind="analyze"],.sealbox[data-kind="decide"]{color:var(--amber)}
.sealbox[data-kind="review"],.sealbox[data-kind="dispatch"]{color:var(--phos)}
.sealbox[data-kind="done"]{color:var(--ok);--glow-c:var(--ok-glow)}
.sealbox[data-kind="clarify"],.sealbox[data-kind="intervene"]{color:var(--seal)}
.sealbox[data-kind="clarify"],.sealbox[data-kind="intervene"]{animation:seal-alert 1.6s ease-in-out infinite}
.sealbox:hover{box-shadow:0 0 0 3px var(--panel),0 0 0 4px currentColor,0 0 30px 3px var(--glow-c)}
.sealbox.drop{animation:seal-drop .44s var(--ease)}
.sealbox.drop .wave{animation:seal-wave .6s var(--ease)}
@keyframes seal-drop{0%{opacity:0;transform:translate(-50%,26px) scale(1.55)}55%{opacity:1;transform:translate(-50%,26px) scale(.95)}100%{opacity:1;transform:translate(-50%,26px) scale(1)}}
@keyframes seal-wave{0%{opacity:.85;transform:scale(1)}100%{opacity:0;transform:scale(1.85)}}
@keyframes seal-alert{0%,100%{box-shadow:0 0 0 3px var(--panel),0 0 0 4px currentColor,0 0 12px var(--glow-c)}50%{box-shadow:0 0 0 3px var(--panel),0 0 0 4px currentColor,0 0 32px 5px var(--glow-c)}}
.lynn-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;position:relative;z-index:5}
.lynn-state{flex:1;min-width:0;font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lynn-state b{color:var(--ink);font-weight:500}
/* 状态句退场：只留状态词 + 三点脉冲，对象与理由点印章再看 */
.st-beat{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle}
.st-beat i{width:3px;height:3px;border-radius:50%;background:var(--phos);animation:blink 1.3s ease-in-out infinite}
.st-beat i:nth-child(2){animation-delay:.18s}.st-beat i:nth-child(3){animation-delay:.36s}

/* 产出柜 */
#p-output{flex:1;min-height:0}
.out-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{border:1px solid var(--line);background:var(--panel-2);padding:7px;cursor:pointer;transition:border-color .18s var(--ease),transform .18s var(--ease),box-shadow .18s var(--ease)}
.out:hover{border-color:var(--phos);transform:translateY(-2px);box-shadow:0 0 14px var(--glow)}
.out.enter{animation:out-in .5s var(--ease)}
.out.void{opacity:.42}
.out .thumb{height:50px;border:1px solid var(--line);background:var(--sunken);padding:6px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.thumb i{display:block;height:2px;background:var(--line-2);border-radius:1px}
.thumb i.w60{width:60%}.thumb i.w80{width:80%}.thumb i.w40{width:40%}.thumb i.w95{width:95%}
.thumb.code i:nth-child(odd){background:var(--ink-3)}
.thumb.code i:nth-child(3n){margin-left:12px;width:55%}
.thumb.sheet{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:2px;padding:5px}
.thumb.sheet i{height:auto;width:auto;background:var(--line);border-radius:0}
.thumb.sheet i:nth-child(4n+1){background:var(--line-2)}
.thumb.image{flex-direction:row;align-items:flex-end;gap:4px;padding:6px}
.thumb.image i{flex:1;height:auto;border-radius:0;background:var(--line-2)}
.thumb.image i:nth-child(1){height:40%}.thumb.image i:nth-child(2){height:72%;background:var(--seal)}
.thumb.image i:nth-child(3){height:54%}.thumb.image i:nth-child(4){height:88%}
.thumb.slides{flex-direction:row;gap:4px;align-items:stretch;padding:6px}
.thumb.slides i{height:auto;width:auto;flex:1;background:var(--line-2);border-radius:0}
.thumb.slides i:first-child{flex:1.5;background:var(--seal)}
.thumb.link{flex-direction:row;align-items:center;justify-content:center;gap:0}
.thumb.link i{height:8px;width:24px;border:1px solid var(--ink-3);background:transparent;border-radius:5px}
.thumb.link i + i{margin-left:-8px}
.out .oname{font-size:10px;margin-top:6px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.out .ometa{display:flex;align-items:center;gap:5px;margin-top:4px}
.out .otype{font-family:var(--mono);font-size:9px;color:var(--ink-3);letter-spacing:.06px}
.out .osrc{font-size:9px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
.out .void-tag{font-size:9px;color:var(--seal)}

/* 底栏 */
.bottom{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:0 20px;background:var(--panel);border-top:1px solid var(--line)}
.modes{display:flex;gap:2px;background:var(--sunken);padding:3px;border:1px solid var(--line)}
.modes button{font-family:var(--mono);font-size:10px;padding:6px 9px;color:var(--ink-3);transition:background .15s var(--ease),color .15s var(--ease),box-shadow .15s var(--ease)}
.modes button[aria-pressed="true"]{background:var(--panel-2);color:var(--phos);box-shadow:0 0 10px var(--glow)}
.cmdline{display:flex;align-items:center;gap:10px;min-width:0}
.cmdline input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--line-2);background:transparent;padding:9px 2px;font-size:12px;outline:none;transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
.cmdline input:focus{border-color:var(--phos);box-shadow:0 6px 12px -10px var(--phos)}
.cmdline input::placeholder{color:var(--ink-3)}
.keycap{font-family:var(--mono);font-size:9px;color:var(--ink-3);border:1px solid var(--line-2);padding:2px 5px}
.send{background:var(--phos);color:var(--bg);padding:10px 18px;font-size:11px;border-radius:1px;transition:transform .14s var(--ease),box-shadow .14s var(--ease)}
.send:hover{box-shadow:0 0 18px var(--glow)}.send:active{transform:scale(.97)}
.demo{display:flex;align-items:center;gap:6px}
.demo button{font-size:10px;color:var(--ink-3);border:1px solid var(--line);padding:6px 8px;transition:border-color .15s var(--ease),color .15s var(--ease)}
.demo button:hover{border-color:var(--phos);color:var(--ink-2)}

/* 浮层 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;z-index:50;padding:32px}
.modal.on{display:flex;animation:fade-in .2s var(--ease)}
.sheetbox{background:var(--panel);border:1px solid var(--line-2);width:min(720px,100%);max-height:82vh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.sheetbox.wide{width:min(860px,100%)}
.mh{display:flex;align-items:baseline;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex:none}
.mh h2{margin:0;font-size:14px;font-weight:500}
.mh .mono{font-size:10px;color:var(--ink-3)}
.mh .x{margin-left:auto;font-size:11px;color:var(--ink-3);border:1px solid var(--line-2);padding:5px 9px}
.mh .x:hover{color:var(--ink);border-color:var(--phos)}
.mb{padding:18px 20px 22px;overflow-y:auto;overscroll-behavior:contain}
.mb pre{font-family:var(--mono);font-size:11px;line-height:1.75;color:var(--ink-2);white-space:pre-wrap;word-break:break-word;margin:0}
.mb .kv{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px 14px;font-size:12px;line-height:1.6;margin-bottom:18px}
.mb .kv dt{color:var(--ink-3)}
.mb .kv dd{margin:0}
.mb .sec{font-size:11px;color:var(--ink-3);margin:18px 0 8px;letter-spacing:.06px}
.mb .full{list-style:none;margin:0;padding:0}
.mb .full li{display:grid;grid-template-columns:66px 78px minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:11px;line-height:1.5}
.mb .full li span:first-child{font-family:var(--mono);color:var(--ink-3)}
.mb .full li span:nth-child(2){color:var(--phos)}
.mb .full li.lv-hot span:last-child{color:var(--seal)}
.thumb.big{height:220px;padding:18px;gap:8px}
.thumb.big i{height:4px}
.thumb.big.sheet{grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(7,1fr);gap:4px;padding:14px}
.thumb.big.image{gap:10px;padding:18px}
.thumb.big.slides{gap:10px;padding:18px}
.thumb.big.link i{height:26px;width:76px;border-radius:14px}
.toast{position:fixed;left:50%;bottom:82px;transform:translate(-50%,6px);background:var(--panel-2);border:1px solid var(--line-2);color:var(--ink);font-size:11px;padding:9px 14px;opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.18);opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes pulse-out{0%{transform:scale(.7);opacity:.9}100%{transform:scale(2.1);opacity:0}}
@keyframes ray-flow{0%{opacity:0;transform:rotate(var(--r,0deg)) scaleX(.2)}50%{opacity:.9}100%{opacity:0;transform:rotate(var(--r,0deg)) scaleX(1)}}
@keyframes q-in{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
@keyframes q-out{0%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(48px) scale(.94)}}
@keyframes scan-x{from{left:-40%}to{left:120%}}
@keyframes t-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes t-pulse{0%,100%{box-shadow:0 0 0 0 transparent}40%{box-shadow:0 0 0 1px var(--phos),0 0 24px var(--glow)}}
@keyframes rail-flow{0%{box-shadow:0 0 0 0 transparent}35%{box-shadow:0 0 9px 2px var(--phos)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes c-in{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:translateX(0)}}
@keyframes line-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes out-in{from{opacity:0;transform:scale(.86) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes f-scan{0%{top:0;opacity:1}100%{top:100%;opacity:0}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}

/* ===== 战果抽屉：一层直达，结果 / 产物 / 流水 / 用量 / 设置 / 档案 ===== */
.dr-scrim{position:fixed;left:0;right:0;top:52px;bottom:68px;background:rgba(0,0,0,.42);opacity:0;visibility:hidden;transition:opacity .26s var(--ease),visibility .26s;z-index:40}
.dr-scrim.on{opacity:1;visibility:visible}
.drawer{position:fixed;right:0;top:52px;bottom:68px;width:min(520px,92vw);z-index:41;display:flex;flex-direction:column;
  background:var(--raised);border-left:1px solid var(--line-2);box-shadow:-24px 0 60px rgba(0,0,0,.42),inset 1px 0 0 rgba(121,194,164,.08);
  transform:translateX(102%);transition:transform .32s var(--ease),visibility .32s;visibility:hidden}
.drawer.on{transform:translateX(0);visibility:visible}
.dr-head{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--line);flex:none;min-width:0}
.dr-head h2{font-size:14px;font-weight:500;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dr-id{font-family:var(--mono);font-size:10px;color:var(--ink-3);flex:none}
.dr-x{margin-left:auto;flex:none;font-size:10px;color:var(--ink-3);border:1px solid var(--line-2);padding:5px 9px}
.dr-x:hover{color:var(--ink);border-color:var(--phos)}
.dr-tabs{display:flex;gap:0;padding:0 16px;border-bottom:1px solid var(--line);flex:none}
.dr-tabs button{font-size:11px;color:var(--ink-3);padding:10px 12px;border-bottom:2px solid transparent;transition:color .15s var(--ease),border-color .15s var(--ease)}
.dr-tabs button.on{color:var(--phos);border-bottom-color:var(--phos)}
.dr-body{flex:1;min-height:0;overflow-y:auto;padding:16px;overscroll-behavior:contain}
.dr-foot{flex:none;border-top:1px solid var(--line);padding:10px 16px;font-family:var(--mono);font-size:9px;color:var(--ink-3);line-height:1.6}
.rs-lead{border:1px solid var(--line);background:var(--sunken);padding:14px;margin-bottom:14px}
.rs-lead .k{font-family:var(--mono);font-size:9px;color:var(--ink-3)}
.rs-lead .v{font-size:14px;line-height:1.65;color:var(--ink);margin-top:7px}
.rs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.rs-cell{border:1px solid var(--line);padding:10px}
.rs-cell b{display:block;font-family:var(--mono);font-size:18px;font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.rs-cell span{font-size:10px;color:var(--ink-3)}
.sec-t{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.ev-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:11px;line-height:1.6}
.ev-row .n{font-family:var(--mono);color:var(--phos)}
.ev-row .src{font-family:var(--mono);font-size:9px;color:var(--ink-3);white-space:normal;overflow-wrap:anywhere;text-align:right;max-width:132px;line-height:1.45}
/* 证据链：来源独占第二行，长路径完整可读，不再被第三列裁掉 */
.ev-row.ev-src{grid-template-columns:30px minmax(0,1fr)}
.ev-row.ev-src .src{grid-column:2;max-width:none;text-align:left;margin-top:2px}
.ev-row.ev-log{grid-template-columns:72px minmax(0,1fr) 116px}
.ev-row.ev-log .n{font-size:9px;color:var(--ink-3)}
.diff{font-family:var(--mono);font-size:10px;line-height:1.7;background:var(--sunken);border:1px solid var(--line);padding:10px;white-space:pre-wrap;word-break:break-word;color:var(--ink-2)}
.diff .add{color:var(--ok)}.diff .del{color:var(--seal)}
.file-tree{font-family:var(--mono);font-size:10px;line-height:1.9;color:var(--ink-2)}
.file-tree .a{color:var(--ok)}.file-tree .m{color:var(--amber)}.file-tree .d{color:var(--seal)}
.doc-view{font-size:12px;line-height:1.85;color:var(--ink-2)}
.doc-view p{margin:0 0 10px}
.ver-row{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:11px}
.ver-row .mono{color:var(--phos)}
.fl-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.fl-toolbar input{flex:1;min-width:0;background:var(--sunken);border:1px solid var(--line);padding:7px 9px;font-size:11px;color:var(--ink);outline:none}
.fl-toolbar input:focus{border-color:var(--phos)}
.fl-toolbar .cnt{font-family:var(--mono);font-size:9px;color:var(--ink-3);white-space:nowrap}
.f-row{display:grid;grid-template-columns:18px minmax(0,1fr) 50px 42px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:11px}
.f-row .ico{font-family:var(--mono);font-size:9px;color:var(--phos);text-align:center;border:1px solid var(--line-2)}
.f-row .path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.f-row .path small{display:block;font-family:var(--mono);font-size:9px;color:var(--ink-3);margin-top:2px}
.f-row .sz,.f-row .st{font-family:var(--mono);font-size:9px;color:var(--ink-3);text-align:right}
.f-row .st.void{color:var(--seal)}
.f-row.hit{background:var(--glow)}
.us-bar{height:6px;background:var(--sunken);border:1px solid var(--line);margin:6px 0 14px;overflow:hidden}
.us-bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .5s var(--ease)}
.us-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:11px}
.us-row b{font-family:var(--mono);font-weight:400;font-variant-numeric:tabular-nums}
.us-note{margin-top:12px;border:1px dashed var(--seal-2);padding:10px;font-size:10px;line-height:1.7;color:var(--ink-3)}
.us-note b{color:var(--seal)}
.cfg-grp{margin-bottom:18px}
.cfg-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:11px}
.cfg-row .lb{flex:1;min-width:0}
.cfg-row .lb small{display:block;font-family:var(--mono);font-size:9px;color:var(--ink-3);margin-top:2px}
.cfg-row input[type=number],.cfg-row input[type=text]{width:88px;background:var(--sunken);border:1px solid var(--line);padding:5px 7px;font-family:var(--mono);font-size:10px;color:var(--ink);outline:none}
.sw{width:32px;height:16px;border:1px solid var(--line-2);background:var(--sunken);position:relative;flex:none;cursor:pointer}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;background:var(--ink-3);transition:transform .16s var(--ease),background .16s var(--ease)}
.sw.on::after{transform:translateX(16px);background:var(--ok)}
.ar-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ar-row:hover{background:var(--glow)}
.ar-row .id{font-family:var(--mono);font-size:10px;color:var(--phos)}
.ar-row .tt{font-size:12px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar-row .mm{font-family:var(--mono);font-size:9px;color:var(--ink-3);white-space:nowrap}
.top-btn{font-family:var(--mono);font-size:10px;color:var(--ink-2);border:1px solid var(--line);padding:5px 9px;background:var(--sunken);box-shadow:inset 0 1px 2px rgba(0,0,0,.3);transition:color .15s var(--ease),border-color .15s var(--ease);white-space:nowrap}
.top-btn:hover{color:var(--phos);border-color:var(--phos)}
#btn-stream[aria-pressed="true"]{color:var(--phos);border-color:var(--phos)}
/* 空态雷达：无命令也要有系统存活感 */
.idle-radar{position:relative;height:126px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px}
.ir-ring,.ir-sweep{position:absolute;left:50%;top:8px;width:84px;height:84px;margin-left:-42px;border-radius:50%}
.ir-ring{border:1px solid var(--line-2);box-shadow:0 0 0 1px var(--line),inset 0 0 18px var(--glow)}
.ir-ring::before,.ir-ring::after{content:'';position:absolute;inset:18px;border:1px solid var(--line);border-radius:50%}
.ir-ring::after{inset:34px;background:var(--phos);opacity:.5;animation:breathe 2.4s ease-in-out infinite}
.ir-sweep{animation:spin 4.2s linear infinite}
.ir-sweep::after{content:'';position:absolute;left:50%;top:2px;width:1px;height:38px;background:var(--phos);opacity:.55}
.ir-beam{position:absolute;top:0;bottom:0;width:38px;background:var(--glow);animation:scan-x 3.4s linear infinite;opacity:.5}
.ir-txt{position:relative;font-family:var(--mono);font-size:10px;color:var(--ink-2)}
.ir-txt b{color:var(--phos);letter-spacing:2px;animation:blink 1.4s steps(1,end) infinite}
.ir-sub{position:relative;font-family:var(--mono);font-size:9px;color:var(--ink-3);margin-top:3px}
/* 演示菜单：低频操作收起，底栏只留下令 */
.demo-wrap{position:relative}
.demo-menu{position:absolute;right:0;bottom:calc(100% + 10px);min-width:136px;background:var(--panel);border:1px solid var(--line-2);box-shadow:0 12px 32px rgba(0,0,0,.4);padding:5px;display:none;z-index:30}
.demo-menu.on{display:block;animation:t-in .18s var(--ease)}
.demo-menu button{display:block;width:100%;text-align:left;font-size:10px;color:var(--ink-2);padding:7px 9px;transition:background .14s var(--ease),color .14s var(--ease)}
.demo-menu button:hover{background:var(--glow);color:var(--ink)}
.ev-kind{font-family:var(--mono);font-size:9px;color:var(--phos);margin-right:5px}
.us-note code{font-family:var(--mono);font-size:9px;color:var(--ink-2)}
.arc-strip{margin-top:10px;border-top:1px solid var(--line);padding-top:2px}
.arc-h{font-family:var(--mono);font-size:9px;color:var(--ink-3);padding:8px 2px 4px}

@media (max-width:1240px){.cols{grid-template-columns:278px minmax(0,1fr) 258px}.top-r{gap:12px}.readout{font-size:10px}}
@media (max-width:1000px){
  .cols{display:block;overflow-y:auto}
  .col{display:block;border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .col.left{display:grid;grid-template-columns:1fr 1fr;height:286px}
  #p-intel,#p-intake{height:286px;flex:none}
  #p-intel{border-right:1px solid var(--line)}
  .col.center{height:560px}
  .map-wrap{height:410px;flex:none}
  .stream{height:146px;flex:none}
  .col.right{display:grid;grid-template-columns:1fr 1fr;height:300px}
  .lynn-panel{height:300px;border-bottom:0;border-right:1px solid var(--line)}
  #p-output{height:300px;flex:none;border-top:0}
  .bottom{grid-template-columns:auto minmax(0,1fr) auto;gap:8px;padding:0 12px}
  .demo{display:none}
  .top-r .readout:nth-child(n+3){display:none}
  .top-r .clock{display:none}
  .drawer{width:min(420px,94vw)}
  .focus{width:248px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="top-l">
      <span class="brand">LYNN</span><span class="div"></span>
      <span class="live"><i></i>侦听</span>
    </div>
    <div class="top-r">
      <button class="seal-mini" id="seal-mini" data-kind="listen" type="button">侦听中</button>
      <span class="readout tick">任务<b id="r-tasks">0</b></span>
      <span class="readout hot tick">待判<b id="r-pending">0</b></span>
      <button class="top-btn" id="btn-archive" title="已完成任务档案">档案</button>
      <button class="top-btn" id="btn-usage" title="token 与缓存命中">用量</button>
      <button class="top-btn" id="btn-config" title="运行 / 模型 / 界面配置">配置</button>
      <button class="top-btn" id="btn-stream" type="button" aria-pressed="false" title="中列流水栏：显示 / 去掉">流水</button>
      <span class="clock" id="clock">--:--:--</span>
      <button class="theme-btn" id="theme">沙盘</button>
    </div>
  </header>

  <div class="cols">
    <section class="col left">
      <div class="panel" id="p-intel">
        <div class="p-head"><h2>来令</h2><span class="sub" id="intel-count">0 条</span></div>
        <div class="p-body" id="intel-list"></div>
        <div class="intel-foot">累计 <b id="q-total">0</b> · 已捞 <b id="q-taken">0</b> · 在池 <b id="q-live">0</b></div>
      </div>
      <div class="panel" id="p-intake">
        <div class="p-head"><h2>战局</h2><span class="sub" id="intake-count">0 任务</span></div>
        <div class="p-body" id="intake-list"></div>
      </div>
    </section>

    <section class="col center">
      <div class="map-wrap" id="map-wrap">
        <canvas id="map"></canvas>
        <div class="map-head"><h2>态势</h2>
          <button class="linkbtn" id="btn-full" type="button">全量</button>
          <button class="linkbtn" id="btn-node" type="button">节点</button>
        </div>
        <div class="map-hint" id="map-hint">点节点锁定 · 拖动拨动球面 <kbd>Esc</kbd></div>
        <div class="map-legend">
          <span><i class="lg on"></i>已核</span><span><i class="lg live"></i>推进</span>
          <span><i class="lg alert"></i>卡点</span><span><i class="lg idle"></i>待办</span>
        </div>
        <div class="map-sig">节点 <b id="g-nodes">0</b> · 链路 <b id="g-links">0</b> · 帧 <b id="g-fps">0</b></div>
        <div class="flow-col left" id="flow-left">
          <div class="flow-cap"><i></i>参谋<span class="mono" id="flow-n-left">00</span></div>
          <div class="flow-body" id="flow-body-left"><div class="flow-track" id="flow-track-left"></div></div>
        </div>
        <div class="flow-col right" id="flow-right">
          <div class="flow-cap"><i></i>席位<span class="mono" id="flow-n-right">00</span></div>
          <div class="flow-body" id="flow-body-right"><div class="flow-track" id="flow-track-right"></div></div>
        </div>
        <div class="alert-hud" id="alert-hud" data-cmd="">
          <div class="ah-top"><i class="ah-led"></i>ALERT / 需介入<span class="n" id="ah-n">01</span></div>
          <div class="ah-title" id="ah-title">风铃已停在当前节点，等待拍板</div>
          <div class="ah-desc" id="ah-desc">—</div>
          <div class="ah-acts">
            <button id="ah-open" type="button">查看并处置</button>
            <button id="ah-retry" class="ghost" type="button">一键授权复跑</button>
          </div>
        </div>
        <div class="focus" id="focus">
          <div class="f-corner tr"></div><div class="f-corner bl"></div><div class="f-scan"></div>
          <div id="f-content"></div>
        </div>
      </div>
      <div class="stream">
        <div class="stream-head">
          <h3>流水</h3><span class="loc" id="stream-loc">—</span><span class="spacer"></span>
        </div>
        <div class="stream-lines" id="stream-lines"></div>
      </div>
    </section>

    <section class="col right">
      <div class="lynn-panel">
        <div class="lynn-head"><h2>风铃</h2><span class="mono" id="lynn-since">00:00</span></div>
        <div class="lynn" id="lynn" data-mode="listen">
          <div class="stage">
            <div class="halo"></div>
            <div class="ring o"></div><div class="ring m"></div><div class="ring i"></div>
            <div class="scan"></div><div class="core"></div>
            <div class="mark" id="mark"></div>
            <div class="ray r1"></div><div class="ray r2"></div><div class="ray r3"></div><div class="ray r4"></div>

你是「风铃」的受理参谋 Intake Analyst。你不执行任务、不写产出，只做一件事：
把用户新下达的每一条命令，判定为「对现有战役的增量」或「一场新战役的起点」。
判定的质量决定整个执行小组是否白干，因此宁可 CLARIFY，不可猜。

# INPUT  (每次调用由运行时注入，不得引用输入之外的任何事实)
<command>           { id, text, created_at, source_session }
<active_tasks>      [ { id, goal, boundaries, done_definition, current_stage,
                        open_subtasks, output_contract, sub_intent_count, budget_left } ]
<recent_decisions>  最近 20 条判定，用于保持口径一致、避免同类命令反复横跳
<user_profile>      { permission: plan|ask|auto|full, budget_left, timezone }

# DECISION SPACE  (互斥，自上而下命中即停)
1. CLARIFY       信息不足 / 存在歧义 / 与已完成定义冲突且无法推断
                 → 不建组、不合并、不改动任何在办任务，转呈用户补一句
2. REVOKE_SIGNAL 命令是对某条已受理条目的撤回、改口或取消
                 → 走撤回协议，不参与下面四类判定
3. INSERT_TOP    同目标，且属于口径修正 / 阻塞解除 / 时限提前 / 验收标准变更
                 → 插入该任务最高优先级；暂停当前子任务并记录恢复点
4. MERGE         同目标、同产出契约、可复用上下文，命令只是补充一个可验收的子结果
                 → 并入该任务成为 sub-intent；不新增席位、不改 goal
5. APPEND        同战役但属后续阶段，改动不影响当前目标与当前产出
                 → 追加到后续阶段队列，当前执行不被打断
6. NEW           目标 / 产出类型 / 验收标准任一不同，或当前无在办任务
                 → 建立新执行小组，登记 goal + boundaries + done_definition

# RULES
- 目标不变性：MERGE / APPEND 不得改写已登记的 goal 与 done_definition；
  只有 INSERT_TOP 可改写，且必须在输出里同时给出 goal.before 与 goal.after。
- 幂等：同一 command.id 重复投递，直接返回首次判定结果，不重复建组、不重复并入。
- 合并上限：单任务 sub-intent ≤ 8；超出改判 APPEND 并在 rationale 里说明。
- 存疑从轻：判定存疑时选对在办任务扰动最小的分支（APPEND > MERGE > INSERT_TOP > NEW）。
- 优先级：INSERT_TOP > MERGE > APPEND > NEW；同优先级按 created_at 早者优先。
- 成本与权限：auto/full 下预算余量 < 10% 时，NEW 一律降级为 CLARIFY 问用户；
  plan 模式下任何 NEW 只出建议、不落库。
- 撤回传播：撤销已受理条目时，先向该任务执行小组发 revoke，冻结相关子任务，
  再更新目标；已生成产出只能标记「作废 / 待复核」，不得直接删除或覆盖。
- 不编造：active_tasks 里没有的字段、用户没说的目标，一律不推断；
  evidence 只能引用输入中确实存在的键路径。
- 回执义务：任何判定都要给出一句用户读得懂的结论（conclusion），
  执行完成要写「已完成 + 产出」，失败要写「因为什么 + 是否需要风铃介入」。

  "needs_user": false,
  "evidence": ["<active_tasks.T-01.goal>", "<command.text>"]
}

  const n=G.clusters.length,R=Math.min(G.W*0.25,G.H*0.33);
  G.clusters.forEach((c,i)=>{

    c.angle=a;c.tx=G.W/2+Math.cos(a)*R;c.ty=G.H/2+Math.sin(a)*R;

      G.clusters.push(c);ripple(G.W/2,G.H/2,'phos',true);

function onEvent(type,p){
  const cx=()=>G.W/2,cy=()=>G.H/2;

    ripple(cx(),cy(),'amber');
  }
  if(type==='pick'){ripple(cx(),cy(),'amber',true)}
  if(type==='analyze'){
    G.clusters.forEach(c=>beam(G.W/2,G.H/2,c.tx,c.ty,'amber'));
  }
  if(type==='decide'){
    const c=cluster(p.taskId||(S.tasks[S.tasks.length-1]||{}).id);
    if(p.decision==='CLARIFY'){ripple(cx(),cy(),'seal',true);return}
    if(p.decision==='NEW'){
      const nt=S.tasks[S.tasks.length-1];

    }else if(c){

    }

function buildGlobe(){

  [[.08,.08],[.32,.00],[.46,.20],[.36,.48],[.12,.44],[.00,.28]],

function hitNode(x,y){

function initGraph(){

  if(window.ResizeObserver)new ResizeObserver(()=>{resizeMap();if(G.locked)positionFocus(G.locked)}).observe($('map-wrap'));

  G.cv.addEventListener('mousemove',e=>{

    G.hover=n?n.id:null;G.cv.style.cursor=n?'crosshair':'default';
  });

  /* 球面可拖动拨动自转；节点上不接管，保留点击锁定 */
  G.cv.addEventListener('mousedown',e=>{
    const r=G.cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    G.dragMoved=0;

  G.cv.addEventListener('click',e=>{

/* ========== HUD 目标锁定卡 ========== */
function positionFocus(id){

  const f=$('focus'),wrap=$('map-wrap');if(!n||!f||!wrap)return;
  const cw=f.offsetWidth||272,ch=f.offsetHeight||300;
  let left=n.hx>G.W*0.58?n.hx-cw-30:n.hx+30;

  let top=clamp(n.hy-46,10,Math.max(10,G.H-ch-10));

/* log = 全量历史（弹窗读它，不被可见区裁剪）；items = 当前 DOM 可见行；ctx = 本事件所属任务线 */
const FLOW={seq:0,ci:0,typing:{left:null,right:null},items:{left:[],right:[]},log:[],sheet:null,ctx:null,pushRaf:{left:0,right:0}};
const corpus=k=>{const a=CORPUS[k]||[];return a[(FLOW.ci++)%a.length]||''};

function finishTyping(side){
  const x=FLOW.typing[side];
  if(x){clearInterval(x.t);x.el.textContent=x.text;x.el.classList.remove('typing');FLOW.typing[side]=null}
}
function typeText(side,el,text){
  finishTyping(side);
  el.classList.add('typing');el.textContent='';let i=0;
  const t=setInterval(()=>{
    i+=2;el.textContent=text.slice(0,i);
    if(i>=text.length){el.textContent=text;el.classList.remove('typing');clearInterval(t);FLOW.typing[side]=null}
  },24);

}
function trimFlow(side){
  const track=$('flow-track-'+side),body=$('flow-body-'+side);if(!track||!body)return;
  const unit=side==='left'?66:84;
  /* 容器高度收敛到整行：先一行行铺满到底，下一行进来才把最上面那行顶出去 */
  body.style.bottom='';
  const raw=body.clientHeight||((side==='left'?7:5)*unit);
  const cap=Math.max(1,Math.floor(raw/unit));
  const rem=raw-cap*unit;
  if(rem>0)body.style.bottom=(8+rem)+'px';
  let pushed=0;
  while(track.children.length>cap){
    const first=track.firstChild;
    if(FLOW.typing[side]&&FLOW.typing[side].el&&first.contains(FLOW.typing[side].el))finishTyping(side);
    track.removeChild(first);pushed++;
  }
  if(pushed){
    /* 先复位到「还在原位」，再落回 0：旧行把整列向上顶出一格 */
    cancelAnimationFrame(FLOW.pushRaf[side]);
    track.style.transition='none';track.style.transform='translateY('+(pushed*unit)+'px)';
    void track.offsetHeight;
    FLOW.pushRaf[side]=requestAnimationFrame(()=>{
      track.style.transition='transform .3s var(--ease)';track.style.transform='translateY(0)';
    });
  }
  const rows=[...track.children],n=rows.length;
  /* 顶部旧行淡成底噪，只有最新一两行保持可读：数据流不抢球心焦点 */
  const floor=document.documentElement.dataset.theme==='light'?.56:.46;
  rows.forEach((el,i)=>{el.style.opacity=(floor+(1-floor)*Math.pow((i+1)/n,1.35)).toFixed(2)});
  const nEl=$('flow-n-'+side);if(nEl)nEl.textContent=String(n).padStart(2,'0');
  const keep=new Set(rows.map(x=>x.dataset.id));
  FLOW.items[side]=FLOW.items[side].filter(x=>keep.has(x.id));
}

    group:ev.group||'',member:ev.member||'',sub:ev.sub||'',text:String(ev.text||''),
    taskId:ev.taskId||opt.taskId||(FLOW.ctx&&FLOW.ctx.taskId)||S.sel.taskId||'',
    cmdId:ev.cmdId||(FLOW.ctx&&FLOW.ctx.cmdId)||''};

    ?'<div class="fl-meta"><span class="fl-ts">'+item.ts.slice(0,5)+'</span><span class="fl-kind '+k+'">'+esc(item.kind)+'</span><span class="fl-who">'+esc(item.who)+'</span></div><div class="fl-text"></div>'
    :'<div class="fl-meta"><span class="fl-ts">'+item.ts.slice(0,5)+'</span><span class="fl-team">'+esc(item.group)+'</span><span class="fl-member">'+esc(item.member)+'</span></div>'+

/* 事件 → 思考流：每个事件给出该角色当时真正会产生的行为与正文 */
function emitThought(type,p){

  const tid=p.taskId||(c&&c.taskId)||S.sel.taskId;

  const tm=teamOf(tid),seat=()=>tm.seats[(FLOW.ci++)%tm.seats.length];

    case 'cmd_in':
      pushThought('left',{kind:'ECHO',sub:'收到命令',text:'总线收到 '+(p.id||'')+'：'+cmdText+'。先入队，等风铃捞取。'});break;
    case 'pick':
      pushThought('left',{kind:'THINK',sub:'思考',text:'捞到 '+(p.cmdId||'')+'。'+corpus('lynnThink')});break;
    case 'analyze':
      pushThought('left',{kind:'THINK',sub:'思考',text:'把「'+cmdText+'」拆成目标 / 边界 / 完成定义，再比对 '+S.tasks.length+' 个在办任务。'});
      pushThought('left',{kind:'TOOL',sub:'调用工具',text:corpus('lynnTool')});break;
    case 'decide':
      pushThought('left',{kind:'DECIDE',sub:'判定',text:(DEC_LABEL[p.decision]||p.decision||'判定')+'：'+(p.conclusion||'按参谋判定落库')+'。目标 '+(p.taskId||tid||'转呈用户')+'，'+(p.goal||'完成定义不变')+'。'});
      if(p.decision!=='CLARIFY'&&p.decision!=='REVOKE_SIGNAL')
        pushThought('right',{kind:'BRIEF',sub:'接收简报',group:tm.name,member:'组长',text:title+' · 已收到风铃下发的简报包，完成定义与工具白名单确认完毕，开始分派席位。'});
      break;
    case 'dispatch':
      pushThought('left',{kind:'BRIEF',sub:'下发简报',text:'向 '+(p.taskId||S.sel.taskId)+' / '+tm.name+' 下发简报：完成定义、工具白名单、截止时间、证据要求。'});
      pushThought('right',{kind:'THINK',sub:'思考',group:tm.name,member:seat(),text:corpus('seatThink')});
      pushThought('right',{kind:'TOOL',sub:'调用工具',group:tm.name,member:seat(),text:corpus('seatTool')});
      break;
    case 'progress':
      pushThought('right',{kind:'RESULT',sub:'席位回报',group:tm.name,member:seat(),text:(p.text||'节点推进')+'。席位回报已写入流，等待风铃核验完成定义。'});
      pushThought('left',{kind:'VERIFY',sub:'核验',text:'check_progress 回报：'+(p.text||'节点推进')+'。对照完成定义无偏差，继续放行。'});
      break;

function sheetScope(){

function sheetLabel(){

function sheetRow(x,silent){

/* ========== 事件引擎 ========== */
const ECHO={
  cmd_in:p=>'总线 · 命令入队广播 '+(p.id||''),
  pick:p=>'总线 · 捞取确认回执 '+(p.cmdId||''),
  analyze:p=>'总线 · 参谋判定请求已发出',
  decide:p=>'总线 · 决策落库 · '+(DEC_LABEL[p.decision]||''),
  dispatch:p=>'总线 · 简报包下发确认',
  output:p=>'总线 · 产出索引已更新',
  done:p=>'总线 · 完成回执写回受理面板',
  fail:p=>'总线 · 失败回执升级风铃'
};
function emit(type,p){
  let o={};
  const T=id=>S.tasks.find(t=>t.id===id);
  const C=id=>S.commands.find(c=>c.id===id);
  switch(type){
    case 'cmd_in':{
      const id=p.id||('C-'+S.seq++);
      if(!C(id)){S.commands.push({id,text:p.text,time:now().slice(0,5),status:'queued',st:'待风铃捞取',taskId:null,progress:0,terminal:''});S.totalCmd++}
      o.enterCmd=id;
      pushFeed(S.sel.taskId,'intake',id+' 命令入队 · 待捞取','warn');
      break;
    }
    case 'pick':{
      S.taken++;S.leaving.push(p.cmdId);S.analyzing.push(p.cmdId);
      setLynn('pick','','捞取命令',p.cmdId);
      pushFeed(S.sel.taskId,'intake',p.cmdId+' 已被风铃捞取，进入受理参谋','');
      o.leaveCmd=p.cmdId;
      const id=p.cmdId;
      setTimeout(()=>{
        S.leaving=S.leaving.filter(x=>x!==id);
        const c=C(id);if(c){c.status='picked';c.st='风铃已捞取';c.progress=1}
        renderIntel();
      },560);
      break;
    }
    case 'analyze':{
      const c=C(p.cmdId);if(c){c.status='analyzing';c.st='拆解中 · 比对在办任务';c.progress=2}
      setLynn('analyze','','分析拆解',p.cmdId+' · 比对 '+S.tasks.length+' 个在办任务');
      pushFeed(S.sel.taskId,'staff',p.cmdId+' 注入提示词：command + active_tasks + recent_decisions','');
      pushFeed(S.sel.taskId,'staff','比对目标 / 产出契约 / 完成定义，生成候选判定','');
      break;
    }
    case 'decide':{
      const c=C(p.cmdId),dec=p.decision;
      S.analyzing=S.analyzing.filter(x=>x!==p.cmdId);
      S.lastDecision={input:SAMPLE_IO.input,output:Object.assign({},SAMPLE_IO.output,{command_id:p.cmdId,decision:dec,target_task_id:p.taskId||null,conclusion:p.conclusion||DEC_LABEL[dec]})};
      setLynn('decide',dec,'判定 · '+DEC_LABEL[dec],p.cmdId+' → '+(p.taskId||'转呈用户'));
      let targetId=p.taskId;
      if(dec==='NEW'){
        const id=p.newTaskId||('T-'+String(S.taskSeq++).padStart(2,'0'));
        const title=p.title||'新任务';
        S.tasks.push({id,title,goal:p.goal||'待登记完成定义',cmds:[p.cmdId],stage:'team',progress:.08,status:'编组中',outputs:[],fresh:true,
          nodes:[{id:'N-'+(++S.nodeSeq),label:shortLabel(p.goal||title),state:'live',key:'team',cmd:p.cmdId},
                 {id:'N-'+(++S.nodeSeq),label:'完成定义已登记',state:'idle',key:'assign',cmd:p.cmdId},
                 {id:'N-'+(++S.nodeSeq),label:'席位待派单',state:'idle',key:'run',cmd:p.cmdId}]});
        targetId=id;o.enterTask=id;S.sel={taskId:id,node:'team'};
        pushFeed(id,'team','新建执行小组，登记目标与完成定义','ok');
        if(c){c.taskId=id;c.status='accepted';c.st='新建 '+id+' · 已受理';c.progress=3}
      }else if(dec==='MERGE'||dec==='INSERT_TOP'||dec==='APPEND'){
        const t=T(p.taskId)||S.tasks[0];targetId=(t||{}).id;
        if(t){
          if(!t.cmds.includes(p.cmdId))t.cmds.push(p.cmdId);
          t.status='执行中';t.progress=Math.min(.96,t.progress+.06);
          addNode(t.id,(c?c.text:p.goal)||'新增子意图','live',dec==='INSERT_TOP'?'assign':'run',p.cmdId);
          flowTask(t.id);pulseTask(t.id);
          pushFeed(t.id,'assign',p.cmdId+' '+DEC_LABEL[dec]+' · 目标未改写','ok');
        }
        if(c){c.taskId=targetId||null;c.status='accepted';c.st=DEC_LABEL[dec]+' → '+targetId;c.progress=3}
      }else if(dec==='CLARIFY'){
        if(c){c.status='failed';c.st='转呈用户 · 需补一句';c.terminal='clarify'}
        setLynn('intervene','CLARIFY','等待澄清',p.cmdId,'clarify');
        pushFeed(S.sel.taskId,'staff',p.cmdId+' 信息不足，转呈用户，未改动任何在办任务','hot');
        onEvent('clarify',{taskId:S.sel.taskId});
      }else if(dec==='REVOKE_SIGNAL'){
        if(c){c.status='revoked';c.st='撤回信号 · 已处理';c.terminal='revoked'}
      }
      if(dec!=='CLARIFY'&&dec!=='REVOKE_SIGNAL'){
        S.intakes.push({id:'I-'+p.cmdId.slice(2),cmdId:p.cmdId,decision:dec,taskId:targetId,revoked:false});
        o.enterCmd=p.cmdId;
      }
      toast(DEC_LABEL[dec]+' · '+p.cmdId);
      break;
    }
    case 'dispatch':{
      setLynn('dispatch','','派发指令',(p.taskId||S.sel.taskId)+' 执行小组');
      pushFeed(p.taskId||S.sel.taskId,'assign','简报包下发 · 工具白名单 + 截止时间','');
      const t=T(p.taskId||S.sel.taskId);if(t){t.nodes.forEach(n=>{if(n.key==='assign'&&n.state==='idle')n.state='live'})}
      break;
    }
    case 'progress':{
      const t=T(p.taskId);
      if(t){t.stage=p.to;t.progress=NODES.findIndex(n=>n[0]===p.to)/(NODES.length-1);t.status=p.status||t.status;pulseTask(t.id);
        t.nodes.forEach(n=>{if(n.state==='live'&&n.key!==p.to)n.state='done'});
        const n=t.nodes.find(x=>x.key===p.to);
        if(n)n.state='live';else if(t.nodes.length<8)addNode(t.id,p.text||'节点推进','live',p.to,'');
        if(p.text){const last=t.nodes[t.nodes.length-1];if(last&&last.key===p.to)last.label=shortLabel(p.text)}
      }
      S.sel={taskId:p.taskId,node:p.to};
      pushFeed(p.taskId,p.to,p.text||'节点推进 · '+NODES.find(n=>n[0]===p.to)[1],p.lv||'');
      pushFeed(p.taskId,p.to,'席位回报 · 证据入卷宗','');
      pushFeed(p.taskId,p.to,'风铃核验完成定义 · 无偏差','ok');
      break;
    }
    case 'output':{
      const id=p.id||('O-'+S.outSeq++);
      S.outputs.push({id,type:p.type,title:p.title,taskId:p.taskId,cmdId:p.cmdId,ver:'v1',status:'已验收',meta:p.meta||'已生成'});
      const t=T(p.taskId);if(t&&!t.outputs.includes(id))t.outputs.push(id);
      o.enterOut=id;
      pushFeed(p.taskId,'run',p.title+' 产出入库 · '+TYPE_LABEL[p.type],'ok');
      setSeal('review');
      toast('产出入库 · '+p.title);
      break;
    }
    case 'done':{
      const c=C(p.cmdId);
      if(c){c.status='done';c.st='已完成 · 产出 '+p.out;c.progress=4;c.terminal='done'}
      const t=T((c||{}).taskId);
      if(t){const n=t.nodes.find(x=>x.cmd===p.cmdId);if(n)n.state='done';
        t.nodes.forEach(x=>{if(x.state==='live'&&x.key==='run')x.state='done'})}
      setLynn('listen','','侦听中','等待下一条命令','done');
      pushFeed((c&&c.taskId)||S.sel.taskId,'review',p.cmdId+' 回执：已完成，证据齐备','ok');
      break;
    }
    case 'fail':{
      const c=C(p.cmdId);
      if(c){c.status='failed';c.st='需风铃介入 · '+p.reason;c.terminal='fail'}
      const t=p.taskId?T(p.taskId):T((c||{}).taskId);
      if(t){t.status='需介入';
        const n=t.nodes.find(x=>x.cmd===p.cmdId);if(n){n.state='alert';n.label=shortLabel(p.reason||n.label)}
        else addNode(t.id,p.reason||'执行失败','alert','run',p.cmdId);
        pushFeed(t.id,t.stage,p.cmdId+' 执行失败：'+p.reason+' · 已升级风铃','hot');
      }
      setLynn('intervene','INTERVENE','介入处理',p.cmdId+' · '+p.reason,'intervene');
      toast('需风铃介入 · '+p.cmdId);
      break;
    }
    case 'listen':{setLynn('listen','','侦听中','等待下一条命令');break}
  }
  const echo=ECHO[type];
  if(echo)pushFeed(S.sel.taskId,S.sel.node,echo(p),type==='fail'?'hot':((type==='done'||type==='output')?'ok':''));
  emitThought(type,p);
  onEvent(type,Object.assign({},p,{taskId:p.taskId||(C(p.cmdId)||{}).taskId}));
  renderAll(o);
}
function revoke(cmdId){
  const ik=S.intakes.find(x=>x.cmdId===cmdId&&!x.revoked);if(!ik)return;
  ik.revoked=true;
  const c=S.commands.find(x=>x.id===cmdId);
  if(c){c.status='revoked';c.st='已撤回 · 风铃已发变更令';c.terminal='revoked'}
  const t=S.tasks.find(x=>x.id===ik.taskId);
  if(t){
    S.outputs.filter(o=>o.cmdId===cmdId).forEach(o=>o.status='已作废');
    t.nodes=t.nodes.filter(n=>n.cmd!==cmdId||n.cmd===t.cmds[0]);
    t.status='目标已更新';
    pushFeed(t.id,'intake','撤销 '+cmdId+' · 受理条目作废','hot');
    pushFeed(t.id,'assign','向执行小组发 revoke，冻结相关子任务与恢复点','hot');
    pushFeed(t.id,'staff','更新目标与完成定义，已生成产出标记作废 / 待复核','warn');
    pushFeed(t.id,'run','变更令已下达，小组按新目标继续','ok');
    pushThought('left',{kind:'ALERT',sub:'撤回变更令',taskId:t.id,cmdId:cmdId,text:'收到撤回信号 '+cmdId+'。冻结相关子任务，更新目标与完成定义，已生成产出标记作废 / 待复核。'});
    pushThought('right',{kind:'RESULT',sub:'接收变更令',taskId:t.id,cmdId:cmdId,group:teamOf(t.id).name,member:'组长',text:'执行小组已冻结受影响的子任务，按新目标继续；作废产出不删除，留待复核。'});
    S.sel={taskId:t.id,node:'assign'};flowTask(t.id);
    onEvent('revoke',{taskId:t.id});
  }
  setLynn('intervene','INTERVENE','发撤回命令',cmdId+' → '+(ik.taskId||''),'intervene');
  toast('已撤回 '+cmdId+' · 变更令已发到执行小组');
  renderAll({});
  setTimeout(()=>{if(S.lynn.mode==='intervene')emit('listen',{})},2600);
}

/* ========== 用户下达 ========== */
function decideByText(text){
  if(/撤回|取消|不要了|撤销/.test(text))return 'REVOKE_SIGNAL';
  if(/紧急|优先|马上|立刻|先做|最高/.test(text))return 'INSERT_TOP';
  if(/也|顺便|再加上|补充|统一|改成|加上|再算|并进/.test(text)&&S.tasks.length)return 'MERGE';
  if(/之后|后续|等.*完|再做/.test(text))return 'APPEND';
  if(/吗|怎么|是否|不清楚|？|\?/.test(text))return 'CLARIFY';
  return 'NEW';
}
function userCommand(text,forced){
  let id='C-'+S.seq++;while(S.commands.some(c=>c.id===id))id='C-'+S.seq++;
  emit('cmd_in',{id,text});
  const dec=forced||decideByText(text);
  const active=S.tasks.find(t=>t.status==='执行中')||S.tasks[0];
  setTimeout(()=>emit('pick',{cmdId:id}),520);
  setTimeout(()=>emit('analyze',{cmdId:id}),1150);
  setTimeout(()=>{
    if(dec==='REVOKE_SIGNAL'){
      const target=[...S.intakes].reverse().find(x=>!x.revoked);
      if(target)revoke(target.cmdId);else emit('decide',{cmdId:id,decision:'CLARIFY',conclusion:'没有可撤回的受理条目'});
      return;
    }
    if(dec==='NEW'){
      let nt='T-'+String(S.taskSeq++).padStart(2,'0');
      while(S.tasks.some(t=>t.id===nt))nt='T-'+String(S.taskSeq++).padStart(2,'0');
      emit('decide',{cmdId:id,decision:'NEW',title:shortLabel(text),goal:text,newTaskId:nt});
    }else emit('decide',{cmdId:id,decision:dec,taskId:(active||{}).id,goal:text});
  },1900);
  if(dec!=='CLARIFY'&&dec!=='REVOKE_SIGNAL'){
    const tid=dec==='NEW'?'T-'+String(S.taskSeq-1).padStart(2,'0'):(active||{}).id;
    setTimeout(()=>emit('dispatch',{taskId:tid}),2500);
    let oid='O-'+S.outSeq++;while(S.outputs.some(o=>o.id===oid))oid='O-'+S.outSeq++;
    setTimeout(()=>emit('output',{id:oid,type:['doc','sheet','code','slides','image','link'][Math.floor(Math.random()*6)],title:shortLabel(text)+' 产出',taskId:tid,cmdId:id}),3400);

  }
  const list=S.tasks.map(x=>({t:x,u:x.usage||{in:0,out:0,cost:0}}));
  const si=list.reduce((a,x)=>a+x.u.in,0),so=list.reduce((a,x)=>a+x.u.out,0),cost=list.reduce((a,x)=>a+x.u.cost,0);
  const budget=Number(DR.cfg.softBudgetTokens)||0,pct=budget?Math.min(100,Math.round((si+so)/budget*100)):0;
  let h='<div class="rs-grid"><div class="rs-cell"><b>'+num(si)+'</b><span>会话输入</span></div>'+
    '<div class="rs-cell"><b>'+num(so)+'</b><span>会话输出</span></div>'+
    '<div class="rs-cell"><b>¥ '+cost.toFixed(2)+'</b><span>累计</span></div></div>';
  h+='<div class="sec-t">软预算</div><div class="us-bar"><i style="width:'+pct+'%"></i></div>'+
    '<div class="us-row"><span>'+num(si+so)+' / '+(budget?num(budget):'未设预算')+' tok</span><b>'+(budget?pct+'%':'—')+'</b></div>';
  h+='<div class="sec-t">按任务</div>'+list.map(x=>'<div class="us-row" data-utask="'+x.t.id+'" style="cursor:pointer"><span>'+esc(x.t.id+' · '+x.t.title)+'</span><b>'+num(x.u.in+x.u.out)+' tok</b></div>').join('');
  h+='<div class="sec-t">缓存命中</div>'+cacheNote();
  return h;
}
function renderConfig(){

  let h='<div class="cfg-grp"><div class="sec-t">运行</div>'+

}
function renderArchive(){
  const ar=archiveTasks(),ac=S.tasks.filter(t=>!isArchived(t));
  const row=t=>'<div class="ar-row" data-ar="'+t.id+'"><span class="id">'+t.id+'</span>'+
    '<span class="tt">'+esc(t.title)+'</span><span class="mm">'+(TASK_TYPE[t.type]||'任务')+' · '+(t.files||[]).length+' 件 · '+esc(isArchived(t)?(t.closedAt||'已归档'):t.status)+'</span></div>';
  return '<div class="sec-t">归档 · '+ar.length+' 项</div>'+(ar.length?ar.map(row).join(''):'<div class="doc-view"><p>还没有已完成任务。</p></div>')+
    '<div class="sec-t">在办 · '+ac.length+' 项</div>'+ac.map(row).join('');
}
